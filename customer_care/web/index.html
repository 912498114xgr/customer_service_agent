<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>客服 Agent 学习工作台</title>
<style>
:root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#18212b;background:#f4f6f8;font-synthesis:none;text-rendering:optimizeLegibility}*{box-sizing:border-box}body{margin:0}.topbar{height:58px;background:#fff;border-bottom:1px solid #dce2e7;display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100vw - 1320px)/2))}.brand{font-weight:700}.mode{font-size:13px;color:#526171}.mode strong{color:#176b55}.shell{max-width:1320px;margin:auto;padding:22px 20px 36px}.intro{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:18px}.intro h1{font-size:23px;margin:0 0 5px}.intro p{margin:0;color:#536170;font-size:14px}.badge{border:1px solid #d4dce2;background:#fff;border-radius:4px;padding:7px 10px;color:#526171;font-size:12px;white-space:nowrap}.notice{padding:11px 13px;border-left:3px solid #d39126;background:#fff8e8;color:#624a1d;font-size:13px;margin-bottom:18px}.layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(380px,.85fr);gap:18px;align-items:start}.section{background:#fff;border:1px solid #dce2e7;border-radius:6px}.section-head{padding:14px 16px;border-bottom:1px solid #e5e9ec;display:flex;align-items:center;justify-content:space-between;gap:12px}.section-head h2{font-size:15px;margin:0}.section-head span{font-size:12px;color:#697785}.scenarios{padding:12px 16px;border-bottom:1px solid #e5e9ec;display:flex;flex-wrap:wrap;gap:8px}.scenario{border:1px solid #cbd5db;background:#fff;border-radius:4px;color:#253746;padding:7px 10px;font:inherit;font-size:12px;cursor:pointer}.scenario:hover{background:#edf5f2;border-color:#79a999}.messages{height:330px;overflow:auto;padding:12px 16px}.empty{height:100%;display:grid;place-items:center;text-align:center;color:#7b8792;font-size:13px}.message{max-width:88%;padding:10px 12px;margin:8px 0;border-radius:5px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.55}.message.user{margin-left:auto;background:#e9f1f8}.message.agent{background:#edf4f1}.composer{border-top:1px solid #e5e9ec;padding:13px 16px 15px}textarea{display:block;width:100%;min-height:78px;resize:vertical;border:1px solid #cbd5db;border-radius:4px;padding:10px;font:inherit;font-size:14px}textarea:focus{outline:2px solid #9ac9bc;border-color:#548f7e}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:9px}.hint{font-size:12px;color:#71808d}.primary,.secondary{border:0;border-radius:4px;padding:8px 13px;font:inherit;font-size:13px;cursor:pointer}.primary{background:#176b55;color:#fff}.primary:disabled{opacity:.55;cursor:wait}.secondary{background:#eef1f3;color:#31414d}.right{padding:0 16px 16px}.decision{padding-top:15px}.decision h3{font-size:13px;margin:0 0 8px;color:#293b48}.decision p{font-size:13px;line-height:1.55;color:#536170;margin:5px 0}.route{display:inline-block;padding:3px 7px;border-radius:3px;font-size:12px;background:#edf4f1;color:#176b55}.goal-list,.task-list{margin:6px 0;padding-left:19px;color:#364652;font-size:13px;line-height:1.65}.step{position:relative;padding:0 0 14px 17px;border-left:1px solid #c9d4d7;margin-left:5px}.step:last-child{border-left-color:transparent;padding-bottom:0}.step:before{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:#438b75;left:-5px;top:4px}.step.failed:before{background:#bb5145}.step-title{font-size:13px;font-weight:650}.step-body{font-size:12px;color:#5b6975;line-height:1.5;margin-top:3px;overflow-wrap:anywhere}.sources{font-size:12px;line-height:1.5;color:#536170;white-space:pre-wrap}details{border-top:1px solid #e5e9ec;margin-top:14px;padding-top:11px}summary{cursor:pointer;color:#536170;font-size:12px}pre{font-size:11px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;max-height:250px;overflow:auto;color:#34424c;background:#f5f7f8;padding:10px;border-radius:4px}.empty-state{color:#85919b;font-size:13px;padding:20px 0}.error{color:#a5352b}.footer{color:#72808a;font-size:12px;margin-top:16px}@media(max-width:850px){.layout{grid-template-columns:1fr}.messages{height:280px}.intro{align-items:start;flex-direction:column}.badge{white-space:normal}}@media(max-width:480px){.topbar{padding:0 14px}.shell{padding:16px 12px 28px}.mode{font-size:11px}.scenarios{padding:10px}.section-head{padding:12px}.right{padding:0 12px 13px}}
.confirm-box{background:#fff8e8;border:1px solid #e6d39e;border-radius:4px;padding:12px;margin:6px 0 15px}.confirm-box .confirm-actions{display:flex;gap:8px;margin-top:10px}.confirm-box .primary{margin-top:0}.confirm-box .secondary{background:#fff;border:1px solid #8c969f;color:#25313b;border-radius:4px;padding:9px 13px;cursor:pointer}.confirm-box .secondary:disabled{opacity:.55;cursor:wait}
.runtime{display:flex;flex-wrap:wrap;gap:8px;margin:-4px 0 16px}.runtime-item{background:#fff;border:1px solid #dce2e7;border-radius:4px;padding:7px 10px;color:#536170;font-size:12px}.runtime-item strong{color:#243541;font-weight:650}.task-backend{display:inline-block;margin:5px 0 0;padding:2px 6px;background:#e5f1ed;color:#176b55;border-radius:3px;font-size:11px}.task-backend.local{background:#f1eee2;color:#775c16}.task-output{margin-top:6px}
</style>
</head>
<body>
<header class="topbar"><div class="brand">客服 Agent / 学习工作台</div><div id="mode" class="mode">正在检查运行模式…</div></header>
<main class="shell">
  <div class="intro"><div><h1>跟着一次请求看 Agent 如何决策</h1><p>先跑固定场景看清主图，再配置模型体验自由提问。</p></div><span class="badge">订单、退款和账户工具均为本地演示数据</span></div>
  <div id="notice" class="notice">固定剧本会执行客服主图，但模型响应是预置的，只用于学习路由和执行流程，不代表模型效果。</div>
  <div id="runtime" class="runtime" aria-label="服务运行配置"></div>
  <div class="layout">
    <section class="section">
      <div class="section-head"><h2>对话</h2><span id="chatMode">固定剧本演练</span></div>
      <div id="scenarios" class="scenarios" aria-label="固定场景"></div>
      <div id="messages" class="messages"><div class="empty">选择上方场景，或在配置真实模型后输入自己的问题。</div></div>
      <div class="composer"><textarea id="input" placeholder="真实模型模式下输入问题；剧本演练请使用上方固定场景" aria-label="输入问题"></textarea><div class="actions"><span class="hint">Enter 发送，Shift+Enter 换行</span><button id="send" class="primary" disabled>发送</button></div></div>
    </section>
    <section class="section">
      <div class="section-head"><h2>本轮决策解释</h2><span id="routeLabel">等待请求</span></div>
      <div id="decision" class="right"><div class="empty-state">执行一次请求后，这里会按阶段解释识别、路由、工具和结果。</div></div>
    </section>
  </div>
  <div class="footer">演练使用固定模型响应和本地工具结果；真实模式使用本机 .env 配置。不要在此处输入真实个人或支付信息。</div>
</main>
<script>
const input=document.querySelector('#input'),send=document.querySelector('#send'),messages=document.querySelector('#messages'),decision=document.querySelector('#decision'),scenarios=document.querySelector('#scenarios');
let liveEnabled=false;
function el(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node}
function setMessagesEmpty(){messages.replaceChildren(el('div','empty','选择上方场景，或在配置真实模型后输入自己的问题。'))}
function addMessage(role,text){if(messages.querySelector('.empty'))messages.replaceChildren();messages.append(el('div','message '+role,text));messages.scrollTop=messages.scrollHeight}
function step(title,body,failed=false){const item=el('div','step'+(failed?' failed':''));item.append(el('div','step-title',title),el('div','step-body',body));decision.append(item)}
function routeExplanation(trace){const route=trace.route;const labels={multi_skill:'多 Skill 计划',self_service:'单 Skill 自助',awaiting_confirmation:'等待用户确认',clarify:'澄清后再继续',human:'转人工'};document.querySelector('#routeLabel').textContent=labels[route]||route||'未决策';if(route==='awaiting_confirmation')return '工具目录声明该操作有副作用，系统暂停执行并签发短时一次性确认令牌。';if(route==='multi_skill')return '识别到多个明确目标，且没有冲突或澄清标志，因此交给 Planner 生成任务计划。';if(route==='self_service')return '识别为单一目标且通过当前路由门槛，因此进入工具选择。';if(route==='clarify')return trace.intent_conflict?'检测到冲突，按策略先询问用户，不进入 Planner 或工具。':trace.intent_needs_clarification?'意图结果要求澄清，因此不执行工具。':trace.rewrite_ambiguous?'指代对象不唯一，因此先澄清。':'当前意图不足以安全执行，因此先澄清。';if(route==='human')return '当前情绪或置信度策略将请求交给人工处理。';return '路由未能归入已知分支。'}
function renderDecision(trace,demo){decision.replaceChildren();const goals=trace.intent_goals||[];step('1. 意图识别',`主意图：${trace.intent||'未知'}；置信度：${Number(trace.intent_confidence||0).toFixed(2)}。${goals.length?`识别出 ${goals.length} 个目标：`:'没有可用目标。'}`);if(goals.length){const list=el('ul','goal-list');for(const goal of goals)list.append(el('li','',`${goal.intent}：${goal.objective}`));decision.lastChild.append(list)}if(trace.intent_conflict)step('冲突标记','模型标记请求内目标冲突。代码优先转澄清。',true);else if(trace.intent_needs_clarification)step('澄清标记','意图识别认为信息不足，工具执行被跳过。',true);step('2. 路由',routeExplanation(trace));const plan=trace.task_plan;if(plan?.tasks?.length){step('3. Planner 计划',`Planner 输出 ${plan.tasks.length} 个任务。计划经过工具目录、参数和依赖关系校验后才交给执行器。`);const list=el('ol','task-list');for(const task of plan.tasks){const deps=task.dependencies?.length?`；依赖：${task.dependencies.join(', ')}`:'；无前置依赖';list.append(el('li','',`${task.tool_name} (${task.task_id})${deps}`))}decision.lastChild.append(list)}else if(trace.selected_tool){step('3. 工具选择',`${trace.selected_tool}；参数：${JSON.stringify(trace.tool_args||{})}`)}if(trace.awaiting_confirmation&&trace.confirmation){const box=el('div','confirm-box');box.append(el('div','step-title','执行前需要你的明确确认'));for(const action of trace.confirmation.actions||[])box.append(el('div','step-body',`${action.tool_name}：${JSON.stringify(action.arguments)}`));box.append(el('div','step-body',`确认令牌将在 ${trace.confirmation.ttl_seconds} 秒后失效；不确认不会执行。`));const actions=el('div','confirm-actions');for(const [label,kind] of [['确认执行本地演示操作','confirm'],['拒绝执行','cancel']]){const button=el('button',kind==='confirm'?'primary':'secondary',label);button.type='button';button.addEventListener('click',()=>resolveAction(button,trace.confirmation,demo?.id,kind));actions.append(button)}box.append(actions);decision.append(box)}if(trace.execution_status){const results=trace.task_results||[];step('4. 执行结果',`计划状态：${trace.execution_status}${results.length?`；任务结果：${results.map(r=>`${r.task_id}=${r.status}`).join('，')}`:''}`,['failed','partial'].includes(trace.execution_status))}else if(trace.tool_result&&Object.keys(trace.tool_result).length){step('4. 工具结果',JSON.stringify(trace.tool_result))}if(trace.knowledge_sources?.length){step('5. 知识证据',trace.knowledge_sources.map(s=>`${s.title}：${s.snippet}`).join('\n'))}if(trace.metrics){const m=trace.metrics;const spans=(m.llm_spans||[]).map(s=>`${s.node}=${s.elapsed_ms}ms${s.error_type?' ('+s.error_type+')':''}`).join('，')||'无模型调用';step('请求观测',`request_id=${trace.request_id||'未知'}；总请求=${m.elapsed_ms??'未知'} ms；逻辑模型调用=${m.llm_calls??0} 次，累计 ${m.llm_elapsed_ms??0} ms；模型输入/输出=${m.input_chars??0}/${m.output_chars??0} 字符；最终回复=${m.response_chars??0} 字符；粗略 token≈${m.estimated_tokens??0}。该 token 值按字符数/4 估算，不是供应商计费 token。调用分布：${spans}`)}if(demo)step('演练边界','以上模型决策来自固定脚本；图、路由策略和本地工具执行是真实代码路径。该结果不能作为自然语言理解准确率。');const details=document.createElement('details');const safeTrace=structuredClone(trace);if(safeTrace.confirmation)safeTrace.confirmation.token='[不在原始轨迹中展示]';details.append(el('summary','查看原始决策轨迹 JSON'));const pre=el('pre','',JSON.stringify(safeTrace,null,2));details.append(pre);decision.append(details)}
async function request(url,body){send.disabled=true;try{const response=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body||{})});const data=await response.json();if(!response.ok)throw Error(data.detail||'请求失败');addMessage('agent',data.answer||'没有生成回复');renderDecision(data.trace,data.demo);return data}catch(error){addMessage('agent','请求失败：'+error.message);decision.replaceChildren(el('div','empty-state error',error.message))}finally{send.disabled=!liveEnabled}}
async function resolveAction(button,confirmation,demoId,action){const box=button.closest('.confirm-box');box.querySelectorAll('button').forEach(item=>item.disabled=true);const endpoint=action==='confirm'?'confirm':'cancel';const url=demoId?`/v1/demo/${encodeURIComponent(demoId)}/${endpoint}`:`/v1/chat/web-demo-user/${endpoint}`;try{const response=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:confirmation.token})});const data=await response.json();confirmation.token='';if(!response.ok)throw Error(data.detail||'操作失败');addMessage('agent',data.answer||'操作已处理');renderDecision(data.trace,data.demo)}catch(error){box.querySelectorAll('button').forEach(item=>item.disabled=false);addMessage('agent','操作失败：'+error.message)}}
async function runScenario(scenario){addMessage('user',scenario.query);document.querySelector('#chatMode').textContent='固定剧本演练 · '+scenario.title;await request('/v1/demo/'+encodeURIComponent(scenario.id))}
async function chat(){const content=input.value.trim();if(!content||!liveEnabled)return;input.value='';addMessage('user',content);document.querySelector('#chatMode').textContent='真实模型对话';await request('/v1/chat',{user_id:'web-demo-user',content})}
async function init(){try{const health=await fetch('/health').then(r=>r.json());liveEnabled=health.mode==='live'&&health.live_configured;document.querySelector('#mode').innerHTML=liveEnabled?'<strong>真实模型已配置</strong>':'<strong>固定演练可用</strong> · 真实模型未配置';document.querySelector('#notice').textContent=liveEnabled?'真实模式会调用本机配置的模型并可能产生费用；固定剧本仍使用离线响应。':'当前没有可用的真实模型配置。你可以先运行固定剧本；配置 .env 后重启服务即可体验自由提问。';send.disabled=!liveEnabled;input.disabled=!liveEnabled;input.placeholder=liveEnabled?'输入问题，注意真实模型调用可能产生费用':'真实模型未配置；请先使用上方固定场景';const data=await fetch('/v1/demo/scenarios').then(r=>r.json());for(const scenario of data.scenarios){const button=el('button','scenario',scenario.title);button.type='button';button.title=scenario.description;button.addEventListener('click',()=>runScenario(scenario));scenarios.append(button)}}catch(error){document.querySelector('#mode').textContent='服务未连接';document.querySelector('#notice').textContent='无法连接本地 API。请先启动客服 Agent Web 服务。';document.querySelector('#decision').replaceChildren(el('div','empty-state error',error.message))}}
const renderDecisionBase=renderDecision;
renderDecision=function(trace,demo){
  renderDecisionBase(trace,demo);
  const rows=decision.querySelectorAll('.task-list li');
  for(const task of trace.task_plan?.tasks||[]){
    const row=[...rows].find(item=>item.textContent.includes(`(${task.task_id})`));if(!row)continue;
    const backend=trace.tool_backends?.[task.tool_name]||'unknown';
    const result=(trace.task_results||[]).find(item=>item.task_id===task.task_id);
    const label=el('span','task-backend'+(backend==='mcp_stdio'?'':' local'),`${backend==='mcp_stdio'?'MCP stdio':'本地演示'} · ${result?.status||'未执行'}`);
    row.append(document.createElement('br'),label);
    if(result?.output&&Object.keys(result.output).length)row.append(el('pre','task-output',JSON.stringify(result.output,null,2)));
    if(result?.error)row.append(el('div','step-body error',result.error));
  }
};
const initBase=init;
init=async function(){
  await initBase();
  try{const health=await fetch('/health').then(response=>response.json());const root=document.querySelector('#runtime');
    for(const [label,value] of [['模型',health.mode==='live'&&health.live_configured?'真实模型':'脚本演练'],['订单工具',health.mcp_order_tools?'MCP stdio 已启用':'本地演示'],['记忆',health.memory_backend==='sqlite'?'SQLite':'进程内存'],['MCP 工具范围',health.mcp_order_tools?'get_order_status / get_refund_status':'未启用']]){const item=el('div','runtime-item');item.append(el('strong','',label+'：'),document.createTextNode(value));root.append(item)}
  }catch{}
};
send.addEventListener('click',chat);input.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();chat()}});init();
</script>
</body>
</html>
