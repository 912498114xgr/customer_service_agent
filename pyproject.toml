[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-rebuild"
version = "0.1.0"
description = "Local, testable implementations of customer-care and diagnosis agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "openai>=1.40",
    "redis>=5.0",
    "kubernetes>=30.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[tool.setuptools.packages.find]
where = ["."]
include = ["common*", "customer_care*", "diagnosis*"]

[tool.setuptools.package-data]
customer_care = ["data/*.json", "evaluation/*.json", "knowledge/*.json", "web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

